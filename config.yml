database:
  dsn_env: POSTGRES_DSN

library:
  source_priority:
    - radarr
    - sonarr
  paths:
    movies_root_env: MOVIES_LIBRARY_ROOT
    series_root_env: SERIES_LIBRARY_ROOT
    download_root_env: DOWNLOAD_ROOT

library_checks:
  missing_language:
    sources:
      - radarr
      - sonarr
    media_types:
      radarr: movie_file
      sonarr: episode_file
    limit: 1
    filename_only: true
    required_any_tokens:
      - CZ
      - CS
      - SK
      - CZECH
      - SLOVAK

prowlarr_search:
  base_url_env: PROWLARR_URL
  api_key_env: PROWLARR_API_KEY
  type: movie
  limit: 50
  categories:
    - 2000
  language:
    required_any_tokens:
      - CZ
      - CS
      - SK
      - CZECH
      - SLOVAK
    score:
      CZECH: 1200
      SLOVAK: 1200
      CZ: 1000
      CS: 1000
      SK: 1000
  availability:
    min_peers: 3
  scoring:
    seeders_multiplier: 2
    audio:
      TrueHD Atmos: 180
      DTS-X: 175
      TrueHD: 165
      DTS-HD MA: 155
      EAC3 Atmos: 145
      EAC3: 120
      DTS: 95
      AC3: 85
      AAC: 45
      MP3: 10
    video:
      2160p: 140
      1080p: 100
      720p: 40
    source:
      Bluray: 120
      WEB-DL: 95
      WEBDL: 95
      WEBRip: 70
      HDTV: 30
    reject_tokens:
      - CAM
      - TS
      - Telesync
      - HDCAM
      - HDTS
      - kolekcia
      - collection
      - trilogy
      - trilogie
      - 1-3
      - 1 3
      - pack

tagging:
  apply_to_arr: true
  apply_to_database: true
  missing_language_tag:
    label: nodab
    reason: no configured CZ/SK dubbing found
  detected_language_tags:
    cz:
      label: cz
      tokens:
        - CZ
        - CS
        - CZECH
    sk:
      label: sk
      tokens:
        - SK
        - SLOVAK
  arr:
    radarr:
      base_url_env: RADARR_URL
      api_key_env: RADARR_API_KEY
      item_type: movie
      item_path: /api/v3/movie/{id}
      tag_path: /api/v3/tag
    sonarr:
      base_url_env: SONARR_URL
      api_key_env: SONARR_API_KEY
      item_type: series
      item_path: /api/v3/series/{id}
      tag_path: /api/v3/tag

subtitle_scan:
  apply_to_database: true
  apply_to_arr: false
  check_embedded: true
  source_priority:
    - radarr
    - sonarr
  media_types:
    radarr: movie_file
    sonarr: episode_file
  filename_only: true
  sidecar_extensions:
    - .srt
    - .ass
    - .ssa
    - .vtt
    - .sub
  no_subtitle_tag:
    label: no-tit
    reason: no configured subtitle language found
  languages:
    cz:
      label: cz-tit
      tokens:
        - cz
        - cs
        - cze
        - ces
        - czech
    sk:
      label: sk-tit
      tokens:
        - sk
        - svk
        - slo
        - slovak
    en:
      label: en-tit
      tokens:
        - en
        - eng
        - english

assemblarr_library:
  root_env: ASSEMBLARR_LIBRARY_ROOT
  root: /home/joseph/assemblarr/assemblarr_library
  folders:
    incoming: incoming
    processing: processing
    library: library
    archive: archive
    failed: failed
  min_free_gb: 100
  max_candidate_size_gb: 100
  filename_prefix: assemblarr
  transfer_policy:
    keep_original_artifact: true
    require_manual_import: true
    delete_download_after_import: false

download_workspace:
  use_library: false
  root_env: DOWNLOAD_ROOT
  subdir: assemblarr
  incoming_folder: incoming
  processing_folder: processing
  archive_folder: archive
  failed_folder: failed

download_clients:
  enabled: true
  preferred: qbittorrent
  qbittorrent:
    url_env: QBITTORRENT_URL
    username_env: QBITTORRENT_USERNAME
    password_env: QBITTORRENT_PASSWORD
    category: assemblarr
    max_active_torrents: 5
    seed_ratio_limit: 0
    remove_completed_from_client: true
    save_path_env: DOWNLOAD_ROOT
    save_path_subdir: assemblarr/incoming
  sabnzbd:
    url_env: SABNZBD_URL
    api_key_env: SABNZBD_API_KEY
    category: assemblarr
    dir_env: DOWNLOAD_ROOT
    dir_subdir: assemblarr/incoming

download_worker:
  poll_seconds: 60
  queue_fill_per_cycle: 5
  max_targets_per_queue_run: 50
  keep_downloaded_files: true
  postprocess:
    library_audio_remux:
      enabled: true
      max_per_cycle: 1
  stalled:
    enabled: true
    minutes: 180
    remove_from_client: true
    move_to_rss_waitlist: true

pipeline_orchestrator:
  missing_search:
    enabled: true
    interval_seconds: 180
    max_targets_per_run: 50
    max_queue_additions_per_run: 2
  rss_waitlist:
    enabled: true
    interval_seconds: 300
    max_targets_per_run: 25
    max_queue_additions_per_run: 1
  download_sync_extract:
    enabled: true
    interval_seconds: 60
  library_audio_remux:
    enabled: true
    interval_seconds: 120
    max_per_run: 1

download_scan:
  video_extensions:
    - .mkv
    - .mp4
    - .avi
    - .m4v
    - .ts
  subtitle_extensions:
    - .srt
    - .ass
    - .ssa
    - .vtt
    - .sub
  archive_extensions:
    - .zip
    - .rar
    - .7z
    - .tar
    - .gz
  audio_languages:
    cz:
      tokens:
        - cz
        - cs
        - cze
        - ces
        - czech
    sk:
      tokens:
        - sk
        - svk
        - slk
        - slo
        - slovak
        - slovakian
  audio_extract:
    enabled: true
    output_subdir: audio_extracts
    output_extension: .mka
    keep_original_files: true

postprocess_import:
  preferred_audio_languages:
    - cz
    - sk
  remux:
    output_subdir: remux_imports
    output_extension: .mkv
    include_subtitles: true
  radarr:
    enabled: true
    base_url_env: RADARR_URL
    api_key_env: RADARR_API_KEY
    sync_after_import: true
  library_audio_remux:
    enabled: true
    temp_suffix: .assemblarr-remux
    include_original_audio: true
    include_subtitles: true
    set_preferred_audio_default: true
    track_title_suffix: (Assemblarr - possibly incorrect or incomplete)
    archive_subdir: library_audio_archive
    sync_audio:
      enabled: true
      reference_audio_stream_index:
      precision_scale: 0.25
      strategy:
        method: adaptive_anchor_sync
        single_anchor_max_duration_diff_seconds: 4.0
        prefer_silence_windows: true
        silence_window_status: planned
        center_trimmed_edges_probe:
          segment_duration_seconds: 45.0
          anchor_points:
            - 0.5
            - 0.75
          trim_tolerance_seconds: 2.0
          rate_tolerance: 0.002
          sample_length: 0.5
          sample_gap: 9999.0
          start_range: 12.0
          end_range: 12.0
        profiles:
          single_anchor:
            sample_length: 0.25
            sample_gap: 90.0
            start_range: 240.0
            end_range: 120.0
            rate_tolerance: 0.5
            rectify: true
          multi_anchor:
            sample_length: 0.125
            sample_gap: 10.0
            start_range: 180.0
            end_range: 60.0
            rate_tolerance: 0.5
            rectify: true
      preflight_duration_tolerance_seconds: 12.0
      duration_mismatch_policy: reject
      max_silence_padding_seconds: 0.0
      synced_codec: eac3
      synced_bitrate_2ch: 384k
      synced_bitrate_multichannel: 640k
      duration_tolerance_seconds: 0.25
      rate_tolerance: 0.0000001
      archive_subdir: synced_audio
    compat_stereo:
      enabled: true
      codec: aac
      bitrate: 192k
      channels: 2
      prefer_default: true
      title_suffix: Stereo (Assemblarr - possibly incorrect or incomplete)

quality_tagging:
  apply_to_arr: true
  apply_to_database: true
  sources:
    - radarr
  resolution_tags:
    2160p:
      label: 2160p
      tokens:
        - 2160p
      quality_resolution: 2160
    1080p:
      label: 1080p
      tokens:
        - 1080p
      quality_resolution: 1080
    720p:
      label: 720p
      tokens:
        - 720p
      quality_resolution: 720
    576p:
      label: 576p
      tokens:
        - 576p
      quality_resolution: 576
    480p:
      label: 480p
      tokens:
        - 480p
      quality_resolution: 480

library_audio_backup:
  enabled: true
  source: radarr
  default_tag: 2160p
  archive_subdir: library_audio_backups
  output_extension: .mka
  include_languages: 
    - cz
    - sk
  keep_existing: true
