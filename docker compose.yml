services:
  postgres:
    image: postgres:16
    container_name: assemblarr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assemblarr}
      POSTGRES_USER: ${POSTGRES_USER:-assemblarr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-assemblarr} -d ${POSTGRES_DB:-assemblarr}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  assemblarr:
    build:
      context: .
    container_name: assemblarr
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-assemblarr}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-assemblarr}
    working_dir: /app
    command: ["sleep", "infinity"]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ${MOVIES_LIBRARY_ROOT}:${MOVIES_LIBRARY_ROOT}:rw
      - ${SERIES_LIBRARY_ROOT}:${SERIES_LIBRARY_ROOT}:ro
      - ${DOWNLOAD_ROOT}:${DOWNLOAD_ROOT}:rw
      - ${ASSEMBLARR_LIBRARY_ROOT}:${ASSEMBLARR_LIBRARY_ROOT}:rw

  assemblarr-worker:
    build:
      context: .
    container_name: assemblarr-worker
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-assemblarr}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-assemblarr}
    working_dir: /app
    command: ["python", "scripts/run_download_worker.py"]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ${MOVIES_LIBRARY_ROOT}:${MOVIES_LIBRARY_ROOT}:rw
      - ${SERIES_LIBRARY_ROOT}:${SERIES_LIBRARY_ROOT}:ro
      - ${DOWNLOAD_ROOT}:${DOWNLOAD_ROOT}:rw
      - ${ASSEMBLARR_LIBRARY_ROOT}:${ASSEMBLARR_LIBRARY_ROOT}:rw

  assemblarr-audio-backup:
    build:
      context: .
    container_name: assemblarr-audio-backup
    restart: on-failure:5
    user: "${PUID:-1000}:${PGID:-1000}"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-assemblarr}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-assemblarr}
    working_dir: /app
    command: ["python", "scripts/archive_library_audio_by_tag.py", "--batch", "--apply"]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ${MOVIES_LIBRARY_ROOT}:${MOVIES_LIBRARY_ROOT}:ro
      - ${SERIES_LIBRARY_ROOT}:${SERIES_LIBRARY_ROOT}:ro
      - ${DOWNLOAD_ROOT}:${DOWNLOAD_ROOT}:rw
      - ${ASSEMBLARR_LIBRARY_ROOT}:${ASSEMBLARR_LIBRARY_ROOT}:rw

volumes:
  postgres_data:
